# Builds the AVD or the ACME image for amd64 and arm64 on native runners (no QEMU).
# GitLab port of .github/workflows/container_build_native.yml and container_build_acme.yml.
#
# GitLab reads only this file, so it is the entry point for both images:
#   - the "image" input chooses which image to build;
#   - the jobs of each image live in .gitlab/ci/<image>.yml and run only when that image is chosen;
#   - the jobs shared by both images (registry login, multi-arch manifest) are defined below.
#
# Run it from Build → Pipelines → New pipeline (/-/pipelines/new), or with glab ci run --input.

spec:
  inputs:
    image:
      description: "select the image to build (acme needs the matching avd image to be built first)"
      options: ["avd", "acme"]
      default: "avd"
    python_version:
      description: "select Python version (of the AVD base image, for acme)"
      options: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      default: "3.14"
    avd_version:
      description: "select AVD version (of the AVD base image, for acme)"
      options: ["v6.3.0", "v6.4.0", "v6.5.0"]
      default: "v6.5.0"
---
workflow:
  name: "Build $[[ inputs.image ]] container (native runners) - AVD $[[ inputs.avd_version ]], Python $[[ inputs.python_version ]]"
  rules:
    # Manual runs only, like workflow_dispatch: "web" is the GUI, "api" is glab ci run.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

variables:
  IMAGE: "$[[ inputs.image ]]"
  PYTHON_VERSION: "$[[ inputs.python_version ]]"
  AVD_VERSION: "$[[ inputs.avd_version ]]"

include:
  - local: .gitlab/ci/avd.yml
  - local: .gitlab/ci/acme.yml

stages:
  - metadata
  - build
  - publish

default:
  image: docker:29
  # image: docker:29.9.3

# ---------- Shared job templates, used with "extends" in .gitlab/ci/<image>.yml ----------

.registry_login:
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Build on the amd64 and arm64 hosted runners, with a Docker daemon (dind) to build and run the image.
.native_build:
  extends: .registry_login
  stage: build
  parallel:
    matrix:
      - ARCH: amd64
        RUNNER: saas-linux-small-amd64
      - ARCH: arm64
        RUNNER: saas-linux-small-arm64
  tags: [$RUNNER]
  services:
    - docker:29-dind
    # - docker:29.9.3-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    BUILDX_NO_DEFAULT_ATTESTATIONS: 1

# Join the amd64 and arm64 images into one multi-arch image.
# imagetools talks to the registry directly, so no Docker daemon (dind) is needed.
.publish_manifest:
  extends: .registry_login
  stage: publish
  tags: [saas-linux-small-amd64]
  script:
    - |
      docker buildx imagetools create \
        --tag "$IMAGE_NAME:$IMAGE_TAG" \
        --tag "$IMAGE_NAME:latest" \
        "$IMAGE_NAME:$IMAGE_TAG-amd64" \
        "$IMAGE_NAME:$IMAGE_TAG-arm64"
    - docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"
