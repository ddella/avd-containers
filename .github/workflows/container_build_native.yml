---
# Builds the universal image for amd64 and arm64 on native runners (no QEMU).
# The image is built from containers/avd. The avd_version input is the AVD release installed in it.

name: Build universal container (native runners)

"on":
  workflow_dispatch:
    inputs:
      python_version:
        type: choice
        required: true
        description: "select Python version"
        options: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        default: "3.14"
      avd_version:
        type: string
        required: true
        description: "AVD release to install, for example v6.4.0"
        default: "v6.4.0"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/universal
  # IMAGE_TAG: python${{ inputs.python_version }}-avd-${{ github.ref_name }}
  IMAGE_TAG: python${{ inputs.python_version }}-avd-${{ inputs.avd_version }}

jobs:
  build_image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1
      PYTHON_VERSION: ${{ inputs.python_version }}
      AVD_VERSION: ${{ inputs.avd_version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout code ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry 🗝️
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get RFC3339 timestamp for org.opencontainers.image.created label ⌚
        run: echo "RFC3339_TIMESTAMP=$(date --rfc-3339=seconds)" >> "$GITHUB_ENV"

      - name: Build image 🔨
        run: |
          docker build \
            --pull \
            --build-arg "PYTHON_VERSION=$PYTHON_VERSION" \
            --build-arg "AVD_VERSION=$AVD_VERSION" \
            --build-arg "IMAGE_VERSION=$IMAGE_TAG" \
            --build-arg "RFC3339_TIMESTAMP=$RFC3339_TIMESTAMP" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:$IMAGE_TAG-$ARCH" \
            containers/avd

      - name: Check image 🔍
        run: |
          docker run --rm "$IMAGE_NAME:$IMAGE_TAG-$ARCH" \
            sh -c 'whoami; uname -m; python --version; pip show pyavd | grep ^Version; ansible-galaxy collection list arista.avd'

      - name: Push image 🚀
        run: docker push "$IMAGE_NAME:$IMAGE_TAG-$ARCH"

  publish_manifest:
    needs: build_image
    runs-on: ubuntu-24.04
    permissions:
      # Required to create the release.
      contents: write
      packages: write
    steps:
      - name: Login to GitHub Container Registry 🗝️
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image 🏷️
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            "$IMAGE_NAME:$IMAGE_TAG-amd64" \
            "$IMAGE_NAME:$IMAGE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"

      - name: Create or update release 📝
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.avd_version }}
        run: |
          IMAGE="$IMAGE_NAME:$IMAGE_TAG"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          DEBIAN=$(docker run --rm "$IMAGE" cat /etc/debian_version)
          PYTHON=$(docker run --rm "$IMAGE" python -c 'import platform; print(platform.python_version())')
          AVD=$(docker run --rm "$IMAGE" sh -c 'pip show pyavd | sed -n "s/^Version: //p"')
          TITLE="Python $PYTHON, AVD $AVD"

          cat > release-notes.md <<EOF
          Image: \`$IMAGE\`
          Digest: \`$DIGEST\`

          - Debian $DEBIAN (trixie)
          - Python $PYTHON
          - AVD $AVD
          - Merged the base and universal images into one Dockerfile
          - Removed Docker-in-Docker and \`community.general\`
          - Removed the compromised emSign ECC Root CA - G3
          - Last build on $(date -u '+%Y-%m-%d %H:%M UTC') from commit $GITHUB_SHA
          EOF

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md
          fi
