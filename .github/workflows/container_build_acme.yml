---
# Builds the ACME image for amd64 and arm64 on native runners (no QEMU).
# The image is built from containers/custom/acme, on top of the AVD image selected by the inputs.
# The base image's 'latest' tag is resolved to a digest once, so amd64 and arm64 use the same base.

# The latest 'gh', 'glab', 'age' and 'yq' versions are looked up once and passed to docker build,
# so the amd64 and arm64 images get the same versions. Local builds without these build args
# look up the latest versions themselves (the Dockerfile defaults are "latest").

name: Build ACME container (native runners)

"on":
  workflow_dispatch:
    inputs:
      python_version:
        type: choice
        required: true
        description: "select Python version of the AVD base image"
        options: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        default: "3.14"
      avd_version:
        type: choice
        required: true
        description: "select AVD version of the AVD base image"
        options: ["v6.3.0", "v6.4.0", "v6.5.0"]
        default: "v6.5.0"

jobs:
  # Set the image name, tag, base image and tool versions once, so all jobs use the same values.
  # Name: acme-avd<avd_version>-python<python_version>, tag: <year>.<month>.<build number>
  # gh and glab versions have no leading "v", age and yq versions keep it, as the Dockerfile expects.
  image_metadata:
    runs-on: ubuntu-26.04
    permissions:
      # Read the base image's digest, also works if the package is private.
      packages: read
    outputs:
      image_name: ${{ steps.base.outputs.image_name }}
      base_name: ${{ steps.base.outputs.base_name }}
      base_digest: ${{ steps.base.outputs.base_digest }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      gh_version: ${{ steps.metadata.outputs.gh_version }}
      glab_version: ${{ steps.metadata.outputs.glab_version }}
      age_version: ${{ steps.metadata.outputs.age_version }}
      yq_version: ${{ steps.metadata.outputs.yq_version }}
    steps:
      - name: Login to GitHub Container Registry 🗝️
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and resolve base image 🏷️
        id: base
        # Fails here if the AVD image for this AVD and Python combination hasn't been published.
        shell: bash
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
          AVD_VERSION: ${{ inputs.avd_version }}
        run: |
          suffix="avd${AVD_VERSION#v}-python$PYTHON_VERSION"
          base_name="ghcr.io/$GITHUB_REPOSITORY/$suffix:latest"
          if ! base_digest=$(docker buildx imagetools inspect "$base_name" --format '{{json .Manifest.Digest}}' | tr -d '"'); then
            echo "::error::Base image $base_name not found. Build it first with container_build_native.yml."
            exit 1
          fi
          {
            echo "image_name=ghcr.io/$GITHUB_REPOSITORY/acme-$suffix"
            echo "base_name=$base_name"
            echo "base_digest=$base_digest"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Set image tag and tool versions 🏷️
        id: metadata
        # Explicit shell enables pipefail, so a failed lookup stops the job instead of giving an empty version.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "image_tag=$(date -u +%Y.%m).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          gh_version=$(gh api repos/cli/cli/releases/latest --jq '.tag_name | ltrimstr("v")')
          glab_version=$(curl -fsSL https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest | jq -r '.tag_name | ltrimstr("v")')
          age_version=$(gh api repos/FiloSottile/age/releases/latest --jq '.tag_name')
          yq_version=$(gh api repos/mikefarah/yq/releases/latest --jq '.tag_name')
          {
            echo "gh_version=$gh_version"
            echo "glab_version=$glab_version"
            echo "age_version=$age_version"
            echo "yq_version=$yq_version"
          } | tee -a "$GITHUB_OUTPUT"

  build_image:
    needs: image_metadata
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.image_metadata.outputs.image_name }}
      IMAGE_TAG: ${{ needs.image_metadata.outputs.image_tag }}
      BASE_NAME: ${{ needs.image_metadata.outputs.base_name }}
      BASE_DIGEST: ${{ needs.image_metadata.outputs.base_digest }}
      GH_VERSION: ${{ needs.image_metadata.outputs.gh_version }}
      GLAB_VERSION: ${{ needs.image_metadata.outputs.glab_version }}
      AGE_VERSION: ${{ needs.image_metadata.outputs.age_version }}
      YQ_VERSION: ${{ needs.image_metadata.outputs.yq_version }}
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout code ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry 🗝️
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get RFC3339 timestamp for com.acme.image.created label ⌚
        run: echo "RFC3339_TIMESTAMP=$(date --rfc-3339=seconds)" >> "$GITHUB_ENV"

      - name: Build image 🔨
        run: |
          docker build \
            --pull \
            --build-arg "BASE_IMAGE=${BASE_NAME%:*}@$BASE_DIGEST" \
            --build-arg "BASE_NAME=$BASE_NAME" \
            --build-arg "BASE_DIGEST=$BASE_DIGEST" \
            --build-arg "IMAGE_VERSION=$IMAGE_TAG" \
            --build-arg "GH_VERSION=$GH_VERSION" \
            --build-arg "GLAB_VERSION=$GLAB_VERSION" \
            --build-arg "AGE_VERSION=$AGE_VERSION" \
            --build-arg "YQ_VERSION=$YQ_VERSION" \
            --build-arg "RFC3339_TIMESTAMP=$RFC3339_TIMESTAMP" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:$IMAGE_TAG-$ARCH" \
            containers/custom/acme

      - name: Check image 🔍
        run: |
          docker run --rm "$IMAGE_NAME:$IMAGE_TAG-$ARCH" \
            sh -c 'whoami; uname -m; gh --version | head -1; glab --version; age --version; yq --version; yamllint --version; ls /usr/local/share/ca-certificates; ansible-galaxy collection list arista.avd'

      - name: Push image 🚀
        run: docker push "$IMAGE_NAME:$IMAGE_TAG-$ARCH"

  publish_manifest:
    needs: [image_metadata, build_image]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    env:
      IMAGE_NAME: ${{ needs.image_metadata.outputs.image_name }}
      IMAGE_TAG: ${{ needs.image_metadata.outputs.image_tag }}
    steps:
      - name: Login to GitHub Container Registry 🗝️
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image 🏷️
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:$IMAGE_TAG-amd64" \
            "$IMAGE_NAME:$IMAGE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"
